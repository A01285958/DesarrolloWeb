<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../Styles/batallaPokemon.css">
  <title>Batalla Pokémon</title>
</head>
<body>
  <div id="header"></div>

  <main>
    <h1>Batalla Pokémon</h1>

     <div id="winnerBox" class="winner-box"></div>

    <div class="battle-status">
      <div class="fighter-card">
        <h2 id="fighter1Name">Pokémon 1</h2>
        <img id="fighter1Img" src="" alt="pokemon 1">
        <p id="fighter1Hp">Vida: 100%</p>
      </div>

      <div class="vs">VS</div>

      <div class="fighter-card">
        <h2 id="fighter2Name">Pokémon 2</h2>
        <img id="fighter2Img" src="" alt="pokemon 2">
        <p id="fighter2Hp">Vida: 100%</p>
      </div>
    </div>

    <div class="battle-controls">
      <button id="startFightNowBtn">Comenzar batalla</button>
    </div>

    <div id="battleLog" class="battle-log"></div>

  </main>

  <div id="footer"></div>

  <script src="../Scripts/header.js"></script>
  <script src="../Scripts/footer.js"></script>
  <script src="../Scripts/batallaPokemon.js"></script>
</body>
</html>
